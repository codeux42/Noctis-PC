<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>Noctis</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #171a24 0%, #0b0c10 55%, #07080b 100%);
        color: #f4f2ee;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap { display: grid; justify-items: center; gap: 18px; }
      .logo {
        width: 104px;
        height: 104px;
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        animation: float 2.6s ease-in-out infinite;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-weight: 700;
      }
      p { margin: 0; color: #9aa0ae; font-size: 13px; letter-spacing: 0.03em; }
      .bar {
        width: 132px;
        height: 3px;
        margin-top: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      .bar::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #e5b567, #f5d79b);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(250%); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo, .bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="assets/icon.png" alt="" />
      <h1>Noctis</h1>
      <p>Films, séries &amp; TV en direct</p>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </body>
</html>
