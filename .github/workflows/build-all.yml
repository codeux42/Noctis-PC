name: Build Noctis (all platforms)

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      force:
        description: "Publier même sans changement de version"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      build: ${{ steps.bump.outputs.build }}
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: bump
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          previous=""
          if git cat-file -e HEAD^:package.json 2>/dev/null; then
            previous="$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide: $version" >&2
            exit 1
          fi

          build="$(echo "$version" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

          if [[ "$version" == "$previous" && "$FORCE" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement de version ($version) : release ignorée."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version prête à être publiée."
          fi

  windows:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Build portable ZIP
        run: |
          npm run package
          Compress-Archive -Path release\Noctis-win32-x64\* -DestinationPath "Noctis-Portable-$env:VERSION.zip" -Force

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            installer/Noctis-Setup-${{ needs.version.outputs.version }}.exe
            installer/latest.yml
            Noctis-Portable-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  macos:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build macOS (Apple Silicon + Intel)
        run: npx electron-builder --mac --publish never

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            installer/Noctis-${{ needs.version.outputs.version }}-mac-arm64.zip
            installer/Noctis-${{ needs.version.outputs.version }}-mac-x64.zip
          if-no-files-found: error

  linux:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build AppImage and DEB (x64 + arm64)
        run: npx electron-builder --linux --x64 --arm64 --publish never

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            installer/Noctis-${{ needs.version.outputs.version }}-x86_64.AppImage
            installer/Noctis-${{ needs.version.outputs.version }}-arm64.AppImage
            installer/Noctis-${{ needs.version.outputs.version }}-amd64.deb
            installer/Noctis-${{ needs.version.outputs.version }}-arm64.deb
            installer/latest-linux.yml
            installer/latest-linux-arm64.yml
          if-no-files-found: error

  ios:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift packages
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build unsigned iOS app
        working-directory: ios/App
        shell: bash
        run: |
          mkdir -p build
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create IPA and checksums
        working-directory: ios/App
        shell: bash
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/Noctis.app
          cd build
          zip -qry "Noctis-$VERSION-ios.ipa" Payload
          shasum -a 256 "Noctis-$VERSION-ios.ipa" | cut -d ' ' -f 1 > "Noctis-$VERSION-ios.ipa.sha256"
          stat -f%z "Noctis-$VERSION-ios.ipa" > "Noctis-$VERSION-ios.ipa.size"
          ls -lh "Noctis-$VERSION-ios.ipa"

      - name: Upload iOS assets
        uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: |
            ios/App/build/Noctis-${{ needs.version.outputs.version }}-ios.ipa
            ios/App/build/Noctis-${{ needs.version.outputs.version }}-ios.ipa.sha256
            ios/App/build/Noctis-${{ needs.version.outputs.version }}-ios.ipa.size
          if-no-files-found: error

  release:
    needs: [version, windows, macos, linux, ios]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release-assets

      - name: Verify update metadata
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f release-assets/installer/latest.yml
          grep -q "version: $VERSION" release-assets/installer/latest.yml
          grep -q "Noctis-Setup-$VERSION.exe" release-assets/installer/latest.yml
          cat release-assets/installer/latest.yml
          test -f release-assets/installer/latest-linux.yml
          grep -q "version: $VERSION" release-assets/installer/latest-linux.yml

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Noctis ${{ needs.version.outputs.version }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/installer/Noctis-Setup-${{ needs.version.outputs.version }}.exe
            release-assets/installer/latest.yml
            release-assets/Noctis-Portable-${{ needs.version.outputs.version }}.zip
            release-assets/Noctis-${{ needs.version.outputs.version }}-mac-arm64.zip
            release-assets/Noctis-${{ needs.version.outputs.version }}-mac-x64.zip
            release-assets/Noctis-${{ needs.version.outputs.version }}-x86_64.AppImage
            release-assets/Noctis-${{ needs.version.outputs.version }}-arm64.AppImage
            release-assets/Noctis-${{ needs.version.outputs.version }}-amd64.deb
            release-assets/Noctis-${{ needs.version.outputs.version }}-arm64.deb
            release-assets/installer/latest-linux.yml
            release-assets/installer/latest-linux-arm64.yml
            release-assets/Noctis-${{ needs.version.outputs.version }}-ios.ipa
            release-assets/Noctis-${{ needs.version.outputs.version }}-ios.ipa.sha256
            release-assets/Noctis-${{ needs.version.outputs.version }}-ios.ipa.size
